services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: ${HOSTNAME} #optional
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_PATH}/files-docs/syncthing:/config
      - ${SYNCTHING_DATA}:/data
    ports:
      #- 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
    networks:
      - netsec_proxy-net
  stirling-pdf:
    image: frooodle/s-pdf:latest
    #ports:
    #  - '8080:8080'
    volumes:
    #  - ${DOCKER_PATH}/files-docs/stirling-pdf/training-data:/usr/share/tesseract-ocr/4.00/tessdata #Required for extra OCR languages
      - ${DOCKER_PATH}/files-docs/stirling-pdf/data:/configs
    #  - /location/of/customFiles:/customFiles/
    environment:
      - DOCKER_ENABLE_SECURITY=false
    networks:
      - netsec_proxy-net
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - CLI_ARGS= #optional
    volumes:
      - ${DOCKER_PATH}/files-docs/duplicati:/config
      - ${DUPLICATI_BACKUP_PATH}:/backups
      - ${DUPLICATI_SOURCE_PATH}:/source
    ports:
      - 8200:8200
    networks:
      - netsec_proxy-net
    restart: unless-stopped
  wikijs-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: ${WIKIJS_DB_PASS}
      POSTGRES_USER: wikijs
    logging:
      driver: "none"
    restart: unless-stopped
    networks:
      - netsec_proxy-net
    volumes:
      - ${DOCKER_PATH}/files-docs/wikijs/db:/var/lib/postgresql/data
  wikijs:
    image: ghcr.io/requarks/wiki:2
    depends_on:
      - wikijs-db
    environment:
      DB_TYPE: postgres
      DB_HOST: wikijs-db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${WIKIJS_DB_PASS}
      DB_NAME: wiki
    restart: unless-stopped
    #ports:
    #  - "80:3000"
    networks:
      - netsec_proxy-net
networks:
  netsec_proxy-net:
    external: true