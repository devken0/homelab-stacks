---
version: "3.8" 
networks:
  nextcloud-aio:
    external: true
volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
  onlyoffice_data:
  onlyoffice_log:
services:
  onlyoffice-document-server:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-docs
    restart: always
    environment:
      - JWT_SECRET=${ONLYOFFICE_SECRET}
    expose:
      - '80'
      - '443'
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
    networks:
      - nextcloud-aio
  nextcloud-aio-mastercontainer:
    image: nextcloud/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    ports:
      - 8089:8080
    environment:
      APACHE_PORT: 11000
      APACHE_IP_BINDING: "0.0.0.0"
      NEXTCLOUD_DATADIR: "/mnt/nextcloud"
      NEXTCLOUD_MOUNT: "/mnt/"
      SKIP_DOMAIN_VALIDATION: true
      #NEXTCLOUD_ENABLE_DRI_DEVICE: true
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nextcloud-aio
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: ${HOSTNAME} #optional
    environment:
      - PUID=${NEXTCLOUD_DATA_UID}
      - PGID=${NEXTCLOUD_DATA_GID}
      - TZ=${TIMEZONE}
    volumes:
      - ./syncthing:/config
      - ${NEXTCLOUD_DATA}/Sync/App_Backups:/data/App_Backups
      - ${NEXTCLOUD_DATA}/Sync/App_Exports:/data/App_Exports
      - ${NEXTCLOUD_DATA}/Sync/DCIM:/data/DCIM
      - ${NEXTCLOUD_DATA}/Sync/Dropbox:/data/Dropbox
      - ${NEXTCLOUD_DATA}/Sync/Music:/data/Music
      - ${NEXTCLOUD_DATA}/Sync/Pictures:/data/Pictures
      - ${NEXTCLOUD_DATA}/Sync/Sounds:/data/Sounds
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    ports:
      - '8080:8080'
    volumes:
    #  - ./stirling-pdf/training-data:/usr/share/tesseract-ocr/4.00/tessdata #Required for extra OCR languages
      - ./stirling-pdf/data:/configs
    #  - /location/of/customFiles:/customFiles/
    environment:
      - DOCKER_ENABLE_SECURITY=false
    restart: unless-stopped
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - CLI_ARGS= #optional
    volumes:
      - ./duplicati:/config
      - ${DUPLICATI_BACKUP_PATH}:/backups
      - ${DUPLICATI_SOURCE_PATH}:/source
      #- /mnt/directory:/data # additional directories to backup 
    ports:
      - 8200:8200
    restart: unless-stopped
  wikijs:
    image: lscr.io/linuxserver/wikijs:latest
    container_name: wikijs
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - DB_TYPE=sqlite #optional
      - DB_HOST= #optional
      - DB_PORT= #optional
      - DB_NAME= #optional
      - DB_USER= #optional
      - DB_PASS= #optional
    volumes:
      - ./wikijs/config:/config
      - ./wikijs/data:/data
    ports:
      - 3000:3000
    restart: unless-stopped
