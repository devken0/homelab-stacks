---
services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    #security_opt:
    #  - seccomp:unconfined #optional
    environment:
      - PUID=${NEXTCLOUD_DATA_UID}
      - PGID=${NEXTCLOUD_DATA_GID}
      - TZ=${TIMEZONE}
    volumes:
      - ./obsidian:/config
      - ${NEXTCLOUD_DATA}/PKMS:/data
    ports:
      - 3009:3000
      - 3010:3001
    #devices:
    #  - /dev/dri:/dev/dri #optional
    shm_size: "1gb"
    restart: unless-stopped
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    ports: 
      - '8088:80'
    environment: 
      - PGID=${PGID}
      - PUID=${PUID}
    volumes:
      - './filebrowser/config:/config'
      - './filebrowser/database:/database'
      - '/:/srv'
    restart: unless-stopped
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: ${HOSTNAME} #optional
    environment:
      - PUID=${NEXTCLOUD_DATA_UID}
      - PGID=${NEXTCLOUD_DATA_GID}
      - TZ=${TIMEZONE}
    volumes:
      - ./syncthing:/config
      - /mnt/backups:/data/backups
      - /mnt/archives:/data/archives
      - /mnt/media:/data/media
      - ${NEXTCLOUD_DATA}:/data/nextcloud_files
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    ports:
      - '8080:8080'
    volumes:
    #  - ./stirling-pdf/training-data:/usr/share/tesseract-ocr/4.00/tessdata #Required for extra OCR languages
      - ./stirling-pdf/data:/configs
    #  - /location/of/customFiles:/customFiles/
    environment:
      - DOCKER_ENABLE_SECURITY=false
    restart: unless-stopped
