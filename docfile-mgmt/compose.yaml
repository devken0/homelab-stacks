---
services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    #security_opt:
    #  - seccomp:unconfined #optional
    environment:
      - PUID=${NEXTCLOUD_DATA_UID}
      - PGID=${NEXTCLOUD_DATA_GID}
      - TZ=${TIMEZONE}
    volumes:
      - ./obsidian:/config
      - ${NEXTCLOUD_DATA}/PKMS:/data
    ports:
      - 3009:3000
      - 3010:3001
    #devices:
    #  - /dev/dri:/dev/dri #optional
    shm_size: "1gb"
    restart: unless-stopped

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:v2
    container_name: silverbullet
    restart: unless-stopped
    environment:
    - SB_USER=admin:${SB_ADMIN_PASSWORD}
    volumes:
      - ./silverbullet/space:/space
    ports:
      - ${SB_HOST_PORT}:3000
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    ports: 
      - '8088:80'
    environment: 
      - PGID=${PGID}
      - PUID=${PUID}
    volumes:
      - './filebrowser/config:/config'
      - './filebrowser/database:/database'
      - '/:/srv'
    restart: unless-stopped
  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    container_name: libreoffice
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=${NEXTCLOUD_DATA_UID}
      - PGID=${NEXTCLOUD_DATA_GID}
      - TZ=${TIMEZONE}
    volumes:
      - ./libreoffice:/config
      - ${NEXTCLOUD_DATA}/Documents:/data
    ports:
      - 3300:3000
      - 3100:3001
    restart: unless-stopped
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: ${HOSTNAME} #optional
    environment:
      - PUID=${NEXTCLOUD_DATA_UID}
      - PGID=${NEXTCLOUD_DATA_GID}
      - TZ=${TIMEZONE}
    volumes:
      - ./syncthing:/config
      - /mnt/backups:/data/backups
      - /mnt/archives:/data/archives
      - /mnt/media:/data/media
      - ${NEXTCLOUD_DATA}:/data/nextcloud_files
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    ports:
      - '8080:8080'
    volumes:
    #  - ./stirling-pdf/training-data:/usr/share/tesseract-ocr/4.00/tessdata #Required for extra OCR languages
      - ./stirling-pdf/data:/configs
    #  - /location/of/customFiles:/customFiles/
    environment:
      - DOCKER_ENABLE_SECURITY=false
    restart: unless-stopped
  wikijs:
    image: lscr.io/linuxserver/wikijs:latest
    container_name: wikijs
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - DB_TYPE=sqlite #optional
      - DB_HOST= #optional
      - DB_PORT= #optional
      - DB_NAME= #optional
      - DB_USER= #optional
      - DB_PASS= #optional
    volumes:
      - ./wikijs/config:/config
      - ./wikijs/data:/data
    ports:
      - 3000:3000
    restart: unless-stopped
