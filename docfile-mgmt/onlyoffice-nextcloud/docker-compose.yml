services:
  app:
    image: nextcloud:fpm
    command: >
      sh -c "echo 'deb http://kartolo.sby.datautama.net.id/debian bookworm main contrib
      deb http://kartolo.sby.datautama.net.id/debian bookworm-updates main contrib
      deb http://kartolo.sby.datautama.net.id/debian-security bookworm-security main contrib' > /etc/apt/sources.list &&
      apt update && apt install -y ffmpeg imagemagick ghostscript && 
      exec php-fpm"
    container_name: nextcloud 
    restart: always
    expose:
      - '80'
      - '9000'
    volumes:
      - app_data:/var/www/html
      - /mnt/nextcloud:/var/www/html/data
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - db
  onlyoffice-document-server:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-docs 
    restart: always
    environment:
      - JWT_SECRET=${ONLYOFFICE_SECRET}
    expose:
      - '80'
      - '443'
    volumes:
      - document_data:/var/www/onlyoffice/Data
      - document_log:/var/log/onlyoffice
  nginx:
    image: nginx
    container_name: nextcloud-proxy
    restart: always
    ports:
      - 82:80
      - 444:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - app_data:/var/www/html
  db:
    image: mariadb
    container_name: nextcloud-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql 
volumes:
  document_data:
  document_log:
  app_data:
  db_data:
