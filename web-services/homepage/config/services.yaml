---
# https://gethomepage.dev/latest/configs/services

- Virtualization & Containerization:
  - Proxmox VE:
      icon: si-proxmox-#b64ba5
      href: {{HOMEPAGE_VAR_PROXMOX_SITE}}
      description: Hypervisor for KVM and LXCs
      ping: {{HOMEPAGE_VAR_PROXMOX_IP}}
      statusStyle: "basic"
      widget: 
        type: proxmox
        url: {{HOMEPAGE_VAR_PROXMOX_URL}}
        username: {{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}
        password: {{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}
        node: pve1 # optional
        # Allowed fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
  - Portainer:
      icon: si-portainer-#b64ba5
      href: {{HOMEPAGE_VAR_PORTAINER_SITE}}
      description: Container management 
      server: local 
      container: portainer
      statusStyle: "basic"
      widget:
        type: portainer
        url: {{HOMEPAGE_VAR_PORTAINER_URL}}
        env: 1
        key: {{HOMEPAGE_VAR_PORTAINER_API_KEY}}

- Network & Security: 
  - PiHole: 
      icon: pi-hole 
      href: {{HOMEPAGE_VAR_PIHOLE_SITE}}
      description: Network-wide Ad Blocking and DNS.
      ping: {{HOMEPAGE_VAR_PIHOLE_IP}}
      statusStyle: "basic" 
      widget: 
        type: pihole
        url: {{HOMEPAGE_VAR_PIHOLE_URL}}
        #version: 6 # required if running v6 or higher, defaults to 5
        key: {{HOMEPAGE_VAR_PIHOLE_API_KEY}}
  - Vaultwarden:
      icon: vaultwarden-light
      href: {{HOMEPAGE_VAR_VAULTWARDEN_URL}}
      description: Self-hosted Bitwarden server
      #ping: {{HOMEPAGE_VAR_VAULTWARDEN_IP}}
      siteMonitor: {{HOMEPAGE_VAR_VAULTWARDEN_URL}}
      statusStyle: "basic"
  
- System Monitoring:
  - Uptime Kuma:
      icon: si-uptimekuma-#5CDD8B
      href: {{HOMEPAGE_VAR_UPTIMEKUMA_URL}}
      description: Fancy self-hosted monitoring tool
      ping: {{HOMEPAGE_VAR_UPTIMEKUMA_IP}}
      statusStyle: "basic"
      widget: 
        type: uptimekuma
        url: {{HOMEPAGE_VAR_UPTIMEKUMA_URL}}
        slug: hq
  - Gotify:
      icon: gotify 
      href: {{HOMEPAGE_VAR_GOTIFY_SITE}}
      description: Alert/Notification server
      ping: {{HOMEPAGE_VAR_GOTIFY_IP}}
      statusStyle: "basic"
      widget:
        type: gotify
        url: {{HOMEPAGE_VAR_GOTIFY_URL}}
        key: {{HOMEPAGE_VAR_GOTIFY_CLIENT_TOKEN}}

- Backup & Sync:
  - IDrive: 
      icon: https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Flogodix.com%2Flogo%2F1661157.png&f=1&nofb=1&ipt=c2d98563d371c259b4c9761b66addbeebca3b06d285a3178e7f8648e4cfe77d1&ipo=images 
      href: {{HOMEPAGE_VAR_IDRIVE_URL}}
      description: IDrive Backup Server
      ping: {{HOMEPAGE_VAR_IDRIVE_IP}}
      statusStyle: "basic"

- Media Libraries:
  - Kavita:
      icon: kavita 
      href: {{HOMEPAGE_VAR_KAVITA_URL}}
      description: Digital library which supports a vast array of file formats.
      server: local
      container: kavita
      statusStyle: "basic"
      widget:
        type: kavita
        url: https://{{HOMEPAGE_VAR_KAVITA_IP}}:5000
        username: {{HOMEPAGE_VAR_KAVITA_USERNAME}}
        password: {{HOMEPAGE_VAR_KAVITA_PASSWORD}}
  - Audiobookshelf:
      icon: audiobookshelf 
      href: http://abooks.internal
      description: Audiobook and podcasts server
      server: local
      container: audiobookshelf
      statusStyle: "basic"
      widget: 
        type: audiobookshelf
        url: http://audiobookshelf:80
        key: 
