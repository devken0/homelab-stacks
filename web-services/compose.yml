---
version: "3.8"
services:
  wbo:
    image: lovasoa/wbo
    container_name: wbo
    ports:
      - 5005:80
    volumes:
      - ./wbo:/opt/app/server-data" 
    restart: unless-stopped
  picoshare:
    image: mtlynch/picoshare
    container_name: picoshare
    environment:
      - PORT=4001
      - PS_SHARED_SECRET=${PICOSHARE_PASSWORD} # Change to any password
      - PS_BEHIND_PROXY=true
    ports:
      - 4001:4001
    command: -db /data/store.db
    volumes:
      - ./picoshare:/data
    restart: unless-stopped
  linkding:
    container_name: linkding
    image: sissbruecker/linkding:latest
    ports:
      - 9090:9090  
    environment:
      LD_SUPERUSER_NAME: $LD_SUPERUSER_NAME
      LD_SUPERUSER_PASSWORD: $LD_SUPERUSER_PASSWORD
      LD_DISABLE_URL_VALIDATION: True
    volumes:
      - "./linkding:/etc/linkding/data"
    restart: unless-stopped
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ./heimdall:/config
    ports:
      - 8088:80
      - 8443:443
    restart: unless-stopped
