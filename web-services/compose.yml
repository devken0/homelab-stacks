---
version: "3.8"
services:
  it-tools:
    image: ghcr.io/corentinth/it-tools:latest
    container_name: it-tools
    ports:
      - "8022:80"
    restart: unless-stopped
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3009:3000
    volumes:
      - ./homepage/config:/app/config # Make sure your local config directory exists
      #- ./homepage/images:/app/public/images # for setting background images
      - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations, see alternative methods
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    env_file:
      - ./homepage/.env
    restart: unless-stopped
  wbo:
    image: lovasoa/wbo
    container_name: wbo
    ports:
      - 5005:80
    volumes:
      - ./wbo:/opt/app/server-data" 
    restart: unless-stopped
  picoshare:
    image: mtlynch/picoshare
    container_name: picoshare
    environment:
      - PORT=4001
      - PS_SHARED_SECRET=${PICOSHARE_PASSWORD} # Change to any password
      - PS_BEHIND_PROXY=true
    ports:
      - 4001:4001
    command: -db /data/store.db
    volumes:
      - ./picoshare:/data
    restart: unless-stopped
