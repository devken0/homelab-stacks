---
version: "3.8"
services:
  homer:
    image: b4bz/homer:latest
    #to build from source, comment previous line and uncomment below
    #build: .
    container_name: homer
    volumes:
      - ./homer:/www/assets
    environment:
      - init_assets=1
      - ipv6_disable=1
    ports:
      - 8087:8080
    user: ${PUID}:${PGID} # default
    restart: unless-stopped
  wbo:
    image: lovasoa/wbo
    container_name: wbo
    ports:
      - 5005:80
    volumes:
      - ./wbo:/opt/app/server-data" 
    restart: unless-stopped
  picoshare:
    image: mtlynch/picoshare
    container_name: picoshare
    environment:
      - PORT=4001
      - PS_SHARED_SECRET=${PICOSHARE_PASSWORD} # Change to any password
      - PS_BEHIND_PROXY=true
    ports:
      - 4001:4001
    command: -db /data/store.db
    volumes:
      - ./picoshare:/data
    restart: unless-stopped
  linkding:
    container_name: linkding
    image: sissbruecker/linkding:latest
    ports:
      - 9090:9090  
    environment:
      LD_SUPERUSER_NAME: $LD_SUPERUSER_NAME
      LD_SUPERUSER_PASSWORD: $LD_SUPERUSER_PASSWORD
      LD_DISABLE_URL_VALIDATION: True
    volumes:
      - "./linkding:/etc/linkding/data"
    restart: unless-stopped
