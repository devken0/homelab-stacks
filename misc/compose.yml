---
version: "3.8"
services:
  remmina:
    image: lscr.io/linuxserver/remmina:latest
    container_name: remmina
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./remmina:/config
    ports:
      - 3005:3000
      - 3006:3001
    restart: unless-stopped
