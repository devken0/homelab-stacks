---
version: "3.8"
services:
  remmina:
    image: lscr.io/linuxserver/remmina:latest
    container_name: remmina
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./remmina:/config
#    ports:
#      - 3000:3000
#      - 3001:3001
    networks:
      - netsec_proxy-net
    restart: unless-stopped
  webtop:
    image: lscr.io/linuxserver/webtop:latest
    container_name: webtop
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - SUBFOLDER=/ #optional
      - TITLE=Webtop #optional
    volumes:
      - ./webtop:/config
    #  - /var/run/docker.sock:/var/run/docker.sock #optional
    #ports:
    #  - 3000:3000
    #  - 3001:3001
    devices:
      - /dev/dri:/dev/dri #optional
    shm_size: "1gb" #optional
    restart: unless-stopped
    networks:
      - netsec_proxy-net
networks:
  netsec_proxy-net:
    external: true