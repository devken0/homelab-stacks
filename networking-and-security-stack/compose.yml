---
version: "3.8"
services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: always
    container_name: npm
    ports:
      - 80:80 # Public HTTP Port
      - 443:443 # Public HTTPS Port
      - 81:81 # Comment out after creating a proxy host for the service
    environment:
      DISABLE_IPV6: "true"
    volumes:
      - nginxproxymanager_data:/data
      - nginxproxymanager_letsencrypt:/etc/letsencrypt
    networks:
      - npm-net
  ddns-updater:
    image: qmcgaw/ddns-updater
    container_name: ddns-updater
    network_mode: bridge
    ports:
      - 8000:8000/tcp
    volumes:
      - ddns-updater_data:/updater/data
    environment:
    #  - CONFIG=
      - PERIOD=5m
      - UPDATE_COOLDOWN_PERIOD=5m
      - PUBLICIP_FETCHERS=all
      - PUBLICIP_HTTP_PROVIDERS=all
      - PUBLICIPV4_HTTP_PROVIDERS=all
      - PUBLICIPV6_HTTP_PROVIDERS=all
      - PUBLICIP_DNS_PROVIDERS=all
      - PUBLICIP_DNS_TIMEOUT=3s
      - HTTP_TIMEOUT=10s
      - LISTENING_ADDRESS=:8000
      - ROOT_URL=/
    #  - BACKUP_PERIOD=24h # 0 to disable
    #   - BACKUP_DIRECTORY=/updater/data
      - LOG_LEVEL=info
      - LOG_CALLER=hidden
    #  - SHOUTRRR_ADDRESSES=
      - PUID=${PUID}
      - PGID=${PGID}
    restart: always
volumes:
  nginxproxymanager_data:
  nginxproxymanager_letsencrypt:
  ddns-updater_data:
networks:
  npm-net:
    driver: bridge