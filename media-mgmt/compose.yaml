---
services:
  readeck:
    image: codeberg.org/readeck/readeck:latest
    container_name: readeck
    ports:
      - 8001:8000
    environment:
      # Defines the application log level. Can be error, warning, info, debug.
      - READECK_LOG_LEVEL=info
      # The IP address on which Readeck listens.
      - READECK_SERVER_HOST=0.0.0.0
      # The TCP port on which Readeck listens. Update container port above to match (right of colon).
      - READECK_SERVER_PORT=8000
      # The URL prefix of Readeck.
      - READECK_SERVER_PREFIX=/
      # A list of hostnames allowed in HTTP requests. Required for reverse proxy configuration.
      - READECK_ALLOWED_HOSTS=readeck.internal
      # Use the 'X-Forwarded-' headers. Required for reverse proxy configuration.
      - READECK_USE_X_FORWARDED=true
    volumes:
      - readeck-data:/readeck
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/readeck", "healthcheck", "-config", "config.toml"]
      interval: 30s
      timeout: 2s
      retries: 3
  ytdl_material:
    container_name: ytdl_material
    environment:
      ytdl_mongodb_connection_string: 'mongodb://ytdl-mongo-db:27017'
      ytdl_use_local_db: 'false'
      write_ytdl_config: 'true'
      UID: ${PUID}
      GID: ${PGID}
    restart: always
    depends_on:
      - ytdl-mongo-db
    volumes:
      - ./youtubedl-material/appdata:/app/appdata
      - ${DOWNLOADS_PATH}/ytdl/audio:/app/audio
      - ${DOWNLOADS_PATH}/ytdl/video:/app/video
      #- ${MEDIA_PATH}/ytdl/subscriptions:/app/subscriptions
      #- ${MEDIA_PATH}/ytdl/users:/app/users
    ports:
      - "8998:17442"
    image: tzahi12345/youtubedl-material:latest
  ytdl-mongo-db:
    # If you are using a Raspberry Pi, use mongo:4.4.18
    image: mongo:4
    logging:
      driver: "none"
    container_name: mongo-db
    restart: always
    volumes:
      - ./youtubedl-material/db/:/data/db
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
      - AUTO_UPDATE=true #optional
      - RUN_OPTS= #optional
    volumes:
      - ./jackett:/config
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TIMEZONE}
    ports:
      - 5055:5055
    volumes:
      - ./jellyseerr:/app/config
    restart: unless-stopped
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: ${NEXTCLOUD_DATA_UID}:${NEXTCLOUD_DATA_GID} # should be owner of volumes
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info  
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: "${NAVIDROME_BASEURL}"
    volumes:
      - "./navidrome:/data"
      - "${MEDIA_PATH}/audio/music:/music:ro"
  spotdl:
    image: "spotdl/spotify-downloader"
    container_name: spotdl
    command: web --host 0.0.0.0 --web-use-output-dir
    ports:
      - 8810:8800
    volumes:
      - "${MEDIA_PATH}/audio/music:/music"
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - "./sonarr:/config"
      - "${MEDIA_PATH}/video/tv_shows:/tv" #optional
      - "${MEDIA_PATH}/video/kids/shows:/kids"
      - "${MEDIA_PATH}/video/family/shows:/family"
      - "${DOWNLOADS_PATH}/torrents:/downloads" #optional
    ports:
      - 8989:8989
    restart: unless-stopped
  openbooks:
    image: evanbuss/openbooks
    container_name: openbooks
    ports:
      - "8081:80"
    volumes:
      - "${DOWNLOADS_PATH}:/books"
    command: "--persist --name ${OPENBOOKS_USERNAME}"
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./radarr:/config
      - ${MEDIA_PATH}/video/movies:/movies #optional
      - ${MEDIA_PATH}/video/kids/movies:/kids #optional
      - ${MEDIA_PATH}/video/family/movies:/family #optional
      - ${DOWNLOADS_PATH}/torrents:/downloads #optional
    ports:
      - 7878:7878
    restart: unless-stopped
  readarr:
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./readarr:/config
      - ${MEDIA_PATH}/books:/books #optional
      - ${DOWNLOADS_PATH}/torrents:/downloads #optional
    ports:
      - 8787:8787
    restart: unless-stopped
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - DELUGE_LOGLEVEL=error #optional
    volumes:
      - ./deluge:/config
      - ${DOWNLOADS_PATH}/torrents:/downloads
    ports:
      - 8112:8112
      - 6881:6881
      - 6881:6881/udp
      - 58846:58846 #optional
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./bazaarr:/config
      - ${MEDIA_PATH}/video/movies:/movies #optional
      - ${MEDIA_PATH}/video/tv_shows:/tv #optional
      - ${MEDIA_PATH}/video/family/movies:/family/movies
      - ${MEDIA_PATH}/video/family/shows:/family/shows
      - ${MEDIA_PATH}/video/kids/movies:/kids/movies
      - ${MEDIA_PATH}/video/kids/shows:/kids/shows
    ports:
      - 6767:6767
    restart: unless-stopped
  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TIMEZONE}
    ports:
      - "8191:8191"
    restart: unless-stopped
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - 13378:80
    volumes:
      - ${MEDIA_PATH}/audio/audiobooks:/audiobooks
      - ${MEDIA_PATH}/audio/podcasts:/podcasts
      - ./audiobookshelf/config:/config
      - ./audiobookshelf/metadata:/metadata
    environment:
      - TZ=${TIMEZONE}
    restart: unless-stopped
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./kavita:/config
      - ${MEDIA_PATH}/books:/data
    ports:
      - 5000:5000
    restart: unless-stopped
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${NEXTCLOUD_DATA_UID}
      - PGID=${NEXTCLOUD_DATA_GID}
      - TZ=${TIMEZONE}
    volumes:
      - ./lidarr:/config
      - ${MEDIA_PATH}/audio/music:/music #optional
      - ${DOWNLOADS_PATH}/torrents:/downloads #optional
    ports:
      - 8686:8686
    restart: unless-stopped
volumes:
  readeck-data:
