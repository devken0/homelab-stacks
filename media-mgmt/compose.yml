---
version: "3.8"
services:
  ytdl_material:
    environment:
      ytdl_mongodb_connection_string: 'mongodb://ytdl-mongo-db:27017'
      ytdl_use_local_db: 'false'
      write_ytdl_config: 'true'
      UID: ${PUID}
      GID: ${PGID}
    restart: always
    depends_on:
      - ytdl-mongo-db
    volumes:
      - ./youtubedl-material/appdata:/app/appdata
      - ${MEDIA_PATH}/youtubedl/audio:/app/audio
      - ${MEDIA_PATH}/youtubedl/video:/app/video
      - ./youtubedl-material/subscriptions:/app/subscriptions
      - ./youtubedl-material/users:/app/users
    ports:
      - "8998:17442"
    image: tzahi12345/youtubedl-material:latest
  ytdl-mongo-db:
    # If you are using a Raspberry Pi, use mongo:4.4.18
    image: mongo:4
    logging:
      driver: "none"
    container_name: mongo-db
    restart: always
    volumes:
      - ./youtubedl-material/db/:/data/db
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - AUTO_UPDATE=true #optional
      - RUN_OPTS= #optional
    volumes:
      - ./jackett:/config
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TIMEZONE}
    ports:
      - 5055:5055
    volumes:
      - ./jellyseerr:/app/config
    restart: unless-stopped
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: ${PUID}:${PGID} # should be owner of volumes
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info  
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: "${NAVIDROME_BASEURL}"
    volumes:
      - "./navidrome:/data"
      - "${MEDIA_PATH}/music:/music:ro"
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - "./sonarr:/config"
      - "${MEDIA_PATH}/tv_shows:/tv" #optional
      - "${DOWNLOADS_PATH}/torrents:/downloads" #optional
    ports:
      - 8989:8989
    restart: unless-stopped
  openbooks:
    image: evanbuss/openbooks
    container_name: openbooks
    ports:
      - "8081:80"
    volumes:
      - "${DOWNLOADS_PATH}/openbooks:/books"
    command: "--persist --name ${OPENBOOKS_USERNAME}"
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./radarr:/config
      - ${MEDIA_PATH}/movies:/movies #optional
      - ${DOWNLOADS_PATH}/torrents:/downloads #optional
    ports:
      - 7878:7878
    restart: unless-stopped
  readarr:
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./readarr:/config
      - ${MEDIA_PATH}/ebooks:/books #optional
      - ${DOWNLOADS_PATH}/torrents:/downloads #optional
    ports:
      - 8787:8787
    restart: unless-stopped
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - DELUGE_LOGLEVEL=error #optional
    volumes:
      - ./deluge:/config
      - ${DOWNLOADS_PATH}/torrents:/downloads
    ports:
      - 8112:8112
      - 6881:6881
      - 6881:6881/udp
      - 58846:58846 #optional
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./bazaarr:/config
      - ${MEDIA_PATH}/movies:/movies #optional
      - ${MEDIA_PATH}/tv_shows:/tv #optional
    ports:
      - 6767:6767
    restart: unless-stopped
  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TIMEZONE}
    ports:
      - "8191:8191"
    restart: unless-stopped
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - 13378:80
    volumes:
      - ${MEDIA_PATH}/audiobooks:/audiobooks
      - ${MEDIA_PATH}/podcasts:/podcasts
      - ./audiobookshelf/config:/config
      - ./audiobookshelf/metadata:/metadata
    environment:
      - TZ=${TIMEZONE}
    restart: unless-stopped
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./kavita:/config
      - ${MEDIA_PATH}/ebooks:/data
    ports:
      - 5000:5000
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./lidarr:/config
      - ${MEDIA_PATH}/music:/music #optional
      - ${DOWNLOADS_PATH}/torrents:/downloads #optional
    ports:
      - 8686:8686
    restart: unless-stopped
  whisparr:
    container_name: whisparr
    image: ghcr.io/hotio/whisparr:latest
    ports:
      - "6969:6969"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TIMEZONE}
    volumes:
      - ./whisparr:/config
      - ${MEDIA_PATH}/whisparr:/data
      - ${DOWNLOADS_PATH}/torrents:/downloads #optional
    restart: unless-stopped
