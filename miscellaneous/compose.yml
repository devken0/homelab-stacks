---
version: "3.8"
services:
  remmina:
    image: lscr.io/linuxserver/remmina:latest
    container_name: remmina
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${DOCKER_PATH}/misc/remmina:/config
#    ports:
#      - 3000:3000
#      - 3001:3001
    networks:
      - netsec_proxy-net
    restart: unless-stopped
networks:
  netsec_proxy-net:
    external: true