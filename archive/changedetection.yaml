---
services:
  browserless:
    image: ghcr.io/browserless/chromium
    environment:
      - CURRENT=10
      - TOKEN=6R0W53R135510
    ports:
      - 3330:3000
    container_name: browserless
    restart: unless-stopped
  changedetection.io:
    image: lscr.io/linuxserver/changedetection.io:latest
    container_name: changedetection
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - BASE_URL= #optional
      - PLAYWRIGHT_DRIVER_URL="ws://browserless:3000?token=6R0W53R135510" #optional
    volumes:
      - ./changedetection.io:/config
    ports:
      - 5050:5000
    restart: unless-stopped