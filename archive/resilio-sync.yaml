  resilio-sync:
    image: lscr.io/linuxserver/resilio-sync:latest
    container_name: resilio-sync
    environment:
      - PUID=${NEXTCLOUD_DATA_UID}
      - PGID=${NEXTCLOUD_DATA_GID}
      - TZ=${TIMEZONE}
    volumes:
      - ./resilio-sync:/config
      - ${DOWNLOADS_PATH}:/downloads
      - ${NEXTCLOUD_DATA}/Sync:/sync
    ports:
      - 8888:8888
      - 55555:55555
    restart: unless-stopped
