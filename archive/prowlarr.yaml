  prowlarr:                                   
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:      
      - PUID=${PUID}                             
      - PGID=${PGID}                        
      - TZ=${TIMEZONE}                    
    volumes:                                                
      - ./prowlarr:/config                  
    ports:                                  
      - 9696:9696                           
    restart: unless-stopped
