---
version: "3.8"
services:
  code-server:                                                    
    image: lscr.io/linuxserver/code-server:latest                 
    container_name: code-server                                   
    environment:                                                  
      - PUID=${PUID}                             
      - PGID=${PGID}                             
      - TZ=${TIMEZONE}                           
      #- PASSWORD=password #optional             
      #- HASHED_PASSWORD= #optional              
      #- SUDO_PASSWORD=password #optional        
      #- SUDO_PASSWORD_HASH= #optional           
      #- PROXY_DOMAIN=code.internal #optional
      #- DEFAULT_WORKSPACE= #optional        
    volumes:                                 
      - ./code-server:/config                
      - ${HOMELAB_STACKS_DIR}:/homelab-stacks
    ports:                                   
      - 8448:8443                            
    networks:
      - netsec_proxy-net
    restart: unless-stopped
networks: 
  netsec_proxy-net:
    external: true
